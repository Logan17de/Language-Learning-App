name: Validate application

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-grammar-alias-patch:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/durable-custom-lesson-jobs'
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/durable-custom-lesson-jobs
          fetch-depth: 0

      - name: Apply isolated patch
        run: python scripts/apply-grammar-alias-patch.py

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat: learn AI-confirmed grammar pattern aliases"
          git push origin HEAD:agent/durable-custom-lesson-jobs

  validate:
    needs: apply-grammar-alias-patch
    if: always() && (needs.apply-grammar-alias-patch.result == 'success' || needs.apply-grammar-alias-patch.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
