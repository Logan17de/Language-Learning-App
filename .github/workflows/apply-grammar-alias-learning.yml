name: Apply learned grammar alias patch

on:
  push:
    branches:
      - agent/durable-custom-lesson-jobs
    paths:
      - .github/workflows/apply-grammar-alias-learning.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/durable-custom-lesson-jobs
          fetch-depth: 0

      - name: Apply isolated grammar alias learning change
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          engine = Path("lib/gemini/lesson-engine-v2.ts")
          text = engine.read_text()
          old = '''  if (!sameSet(grammar, request.grammar)) {
            issues.push("Grammar output must exactly match the requested patterns.");
          }
'''
          new = '''  // Grammar identifiers are canonicalized after semantic alias validation.
          // Kanji and vocabulary identity checks remain strict.
'''
          if old not in text:
              raise SystemExit("lesson-engine-v2 grammar validation block not found")
          engine.write_text(text.replace(old, new, 1))

          library = Path("lib/gemini/lesson-library-v2.ts")
          text = library.read_text()
          import_anchor = 'import type { JLPTLevel } from "@/types/lesson";\n'
          import_line = 'import { canonicalizeLearnedGrammarPatterns } from "@/lib/gemini/grammar-pattern-learning";\n'
          if import_line not in text:
              if import_anchor not in text:
                  raise SystemExit("lesson-library import anchor not found")
              text = text.replace(import_anchor, import_anchor + import_line, 1)

          old = '''    const stored = await client.rpc("enrich_custom_lesson_library_v2", {
              p_level: input.level,
              p_seed: enrichment.seed as unknown as Json,
              p_source_model: enrichment.model,
            });
'''
          new = '''    const learnedGrammar = await canonicalizeLearnedGrammarPatterns({
              requestedPatterns: unknownGrammar,
              generatedGrammar: enrichment.seed.grammar,
            });
            const canonicalSeed = {
              ...enrichment.seed,
              grammar: learnedGrammar,
            };
            const stored = await client.rpc("enrich_custom_lesson_library_v2", {
              p_level: input.level,
              p_seed: canonicalSeed as unknown as Json,
              p_source_model: enrichment.model,
            });
'''
          if old not in text:
              raise SystemExit("lesson-library enrichment storage block not found")
          library.write_text(text.replace(old, new, 1))

          db = Path("types/database.ts")
          text = db.read_text()
          old = 'grammar_catalog: TableDef<Timestamps & { id: string; pattern: string; jlpt_level: Database["public"]["Enums"]["jlpt_level"]; source_order: number; active: boolean }>;'
          new = 'grammar_catalog: TableDef<Timestamps & { id: string; pattern: string; jlpt_level: Database["public"]["Enums"]["jlpt_level"]; source_order: number; active: boolean; accepted_patterns: string[] }>;'
          if old not in text:
              raise SystemExit("database grammar_catalog type not found")
          text = text.replace(old, new, 1)
          fn_anchor = '''      enrich_custom_lesson_library_v2: {
                Args: { p_level: Database["public"]["Enums"]["jlpt_level"]; p_seed: Json; p_source_model: string };
                Returns: Json;
              };
'''
          fn_new = fn_anchor + '''      learn_grammar_pattern_alias: {
                Args: { p_canonical_pattern: string; p_alias: string; p_confidence: number };
                Returns: boolean;
              };
'''
          if fn_anchor not in text:
              raise SystemExit("database function type anchor not found")
          db.write_text(text.replace(fn_anchor, fn_new, 1))

          helper = Path("lib/gemini/grammar-pattern-learning.ts")
          helper.write_text('''import "server-only";

import { createAdminClient } from "@/lib/supabase/admin";
import { generateStructured, type JsonSchema } from "@/lib/gemini/structured-output";
import type { LibrarySeedGrammar } from "@/lib/gemini/lesson-engine-v2";

const CONFIDENCE_THRESHOLD = 0.95;

interface GrammarAliasJudgment {
  verdict: "correct" | "wrong";
  confidence: number;
}

function normalizePattern(value: string): string {
  return value.normalize("NFKC").replace(/[〜~]/gu, "～").replace(/\\s+/gu, "").trim();
}

async function judgeGrammarAlias(
  canonicalPattern: string,
  proposedPattern: string,
): Promise<GrammarAliasJudgment> {
  const schema: JsonSchema = {
    type: "object",
    additionalProperties: false,
    required: ["verdict", "confidence"],
    properties: {
      verdict: { type: "string", enum: ["correct", "wrong"] },
      confidence: { type: "number", minimum: 0, maximum: 1 },
    },
  };
  const result = await generateStructured<GrammarAliasJudgment>({
    name: "grammar pattern alias judgment",
    prompt: [
      "Decide whether the proposed Japanese grammar pattern is a valid surface-form variation of the canonical grammar pattern.",
      "Accept polite, plain, contracted, and orthographic variations only when they express the same grammatical construction.",
      "Reject merely related grammar, example sentences, explanations, broader phrases, and different meanings.",
      `Canonical pattern: ${canonicalPattern}`,
      `Proposed pattern: ${proposedPattern}`,
      'Return verdict "correct" or "wrong" and a confidence from 0 to 1.',
    ].join("\\n"),
    schema,
    validate: (value) => {
      if (!value || typeof value !== "object" || Array.isArray(value)) {
        return ["Judgment must be an object."];
      }
      const record = value as Record<string, unknown>;
      if (record.verdict !== "correct" && record.verdict !== "wrong") {
        return ["Judgment needs a valid verdict."];
      }
      if (typeof record.confidence !== "number" || record.confidence < 0 || record.confidence > 1) {
        return ["Judgment needs confidence between 0 and 1."];
      }
      return [];
    },
  });
  return result.value;
}

export async function canonicalizeLearnedGrammarPatterns(input: {
  requestedPatterns: string[];
  generatedGrammar: LibrarySeedGrammar[];
}): Promise<LibrarySeedGrammar[]> {
  if (input.requestedPatterns.length !== input.generatedGrammar.length) {
    throw new Error("Grammar output must contain exactly the requested number of patterns.");
  }
  if (input.requestedPatterns.length === 0) return [];

  const admin = createAdminClient();
  const catalog = await admin
    .from("grammar_catalog")
    .select("pattern,accepted_patterns")
    .in("pattern", input.requestedPatterns)
    .eq("active", true);
  if (catalog.error) throw new Error(`Grammar aliases could not be loaded: ${catalog.error.message}`);

  const knownAliases = new Map<string, Set<string>>();
  for (const row of catalog.data ?? []) {
    knownAliases.set(
      row.pattern,
      new Set([row.pattern, ...(row.accepted_patterns ?? [])].map(normalizePattern)),
    );
  }

  const unused = new Set(input.requestedPatterns);
  const resolved: LibrarySeedGrammar[] = [];

  for (const generated of input.generatedGrammar) {
    const proposed = normalizePattern(generated.pattern);
    let canonical = [...unused].find((pattern) =>
      knownAliases.get(pattern)?.has(proposed),
    );

    if (!canonical) {
      const judgments = await Promise.all(
        [...unused].map(async (pattern) => ({
          pattern,
          judgment: await judgeGrammarAlias(pattern, generated.pattern),
        })),
      );
      const approved = judgments.filter(({ judgment }) =>
        judgment.verdict === "correct" && judgment.confidence >= CONFIDENCE_THRESHOLD,
      );
      if (approved.length !== 1) {
        throw new Error(`Grammar pattern ${generated.pattern} does not uniquely match a requested pattern.`);
      }
      canonical = approved[0].pattern;
      const learned = await admin.rpc("learn_grammar_pattern_alias", {
        p_canonical_pattern: canonical,
        p_alias: generated.pattern,
        p_confidence: approved[0].judgment.confidence,
      });
      if (learned.error) throw new Error(`Grammar alias could not be saved: ${learned.error.message}`);
    }

    unused.delete(canonical);
    resolved.push({ ...generated, pattern: canonical });
  }

  if (unused.size > 0) {
    throw new Error("Grammar output did not cover every requested pattern.");
  }
  return resolved;
}
''')

          test = Path("tests/custom-lesson-engine.test.ts")
          text = test.read_text()
          anchor = '''    expect(durableMigration).toContain("completed_groups");
            });
'''
          replacement = '''    expect(durableMigration).toContain("completed_groups");
            });

            it("learns AI-confirmed grammar aliases without weakening kanji identity", () => {
              const engine = readFileSync("lib/gemini/lesson-engine-v2.ts", "utf8");
              const learning = readFileSync("lib/gemini/grammar-pattern-learning.ts", "utf8");
              const migration = readFileSync(
                "supabase/migrations/20260728020000_learned_grammar_patterns.sql",
                "utf8",
              );
              expect(engine).toContain("Grammar identifiers are canonicalized after semantic alias validation");
              expect(engine).toContain("Kanji output must exactly match the requested characters");
              expect(learning).toContain("learn_grammar_pattern_alias");
              expect(learning).toContain("accepted_patterns");
              expect(learning).toContain("CONFIDENCE_THRESHOLD = 0.95");
              expect(migration).toContain("accepted_patterns");
            });
'''
          if anchor not in text:
              raise SystemExit("test insertion anchor not found")
          test.write_text(text.replace(anchor, replacement, 1))
          PY

      - name: Remove one-shot workflow
        run: rm .github/workflows/apply-grammar-alias-learning.yml

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: learn AI-confirmed grammar pattern aliases"
          git push origin HEAD:agent/durable-custom-lesson-jobs
