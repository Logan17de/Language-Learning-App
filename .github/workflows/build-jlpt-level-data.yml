name: Build JLPT level data

on:
  push:
    branches:
      - main
    paths:
      - scripts/build_jlpt_level_data.py
      - data/jlpt-catalog.json
      - Vocabs/jlpt_all_kanji_with_kana_readings.csv
      - .github/workflows/build-jlpt-level-data.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate level-wise JLPT data
        run: python scripts/build_jlpt_level_data.py

      - name: Validate generated files
        shell: bash
        run: |
          set -euo pipefail
          for level in N5 N4 N3 N2 N1; do
            test -s "data/jlpt/$level/kanji.json"
            test -s "data/jlpt/$level/vocabulary.json"
            test -s "data/jlpt/$level/grammar.json"
          done
          test -s data/jlpt/manifest.json
          test -s data/jlpt/README.md

      - name: Commit generated data
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- data/jlpt)" ]; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jlpt
          git commit -m "Add level-wise JLPT kanji vocabulary grammar [skip ci]"
          git push
