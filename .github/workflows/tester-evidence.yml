name: Tester evidence

on:
  pull_request:
  push:
    branches:
      - validation/translation-evaluation-contract
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: test.apps.googleusercontent.com
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: npm ci
        run: npm ci

      - name: npm run typecheck
        continue-on-error: true
        run: npm run typecheck

      - name: npm run lint
        continue-on-error: true
        run: npm run lint

      - name: npm test
        continue-on-error: true
        run: npm test

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: supabase start
        continue-on-error: true
        run: supabase start

      - name: supabase test db
        continue-on-error: true
        run: supabase test db

      - name: npm run build
        continue-on-error: true
        run: npm run build

      - name: Link shared Supabase for dry-run only
        if: ${{ env.SUPABASE_ACCESS_TOKEN != '' && env.SUPABASE_DB_PASSWORD != '' }}
        continue-on-error: true
        run: supabase link --project-ref jxvabaqswqembehxligi --password "$SUPABASE_DB_PASSWORD"

      - name: db push dry-run linked
        continue-on-error: true
        run: npx --yes supabase@latest db push --dry-run --linked
