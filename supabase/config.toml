project_id = "aiko-local"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql", "./seed-canonical-lesson.sql"]

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "https://aiko.zetbros.com"
additional_redirect_urls = ["https://aiko.zetbros.com/**"]
enable_signup = true

[auth.email]
otp_length = 6
otp_expiry = 300

[auth.email.template.recovery]
subject = "Your AIko password reset code"
content_path = "./supabase/templates/recovery.html"

[storage]
enabled = true
file_size_limit = "25MiB"

[storage.buckets.lesson-images]
public = true
file_size_limit = "10MiB"
allowed_mime_types = ["image/png", "image/jpeg", "image/webp"]

[storage.buckets.lesson-audio]
public = false
file_size_limit = "15MiB"
allowed_mime_types = ["audio/mpeg", "audio/ogg", "audio/wav"]

[storage.buckets.user-exports]
public = false
file_size_limit = "10MiB"
allowed_mime_types = ["application/json"]
